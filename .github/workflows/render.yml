name: Render video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (browser + fallback voice)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 espeak-ng ffmpeg

      - name: Install Remotion (latest 4.x, all packages same version)
        run: |
          V=$(npm view remotion@4 version | tail -1 | awk '{print $NF}' | tr -d "'")
          echo "Using Remotion $V"
          npm install --save-exact remotion@$V @remotion/cli@$V @remotion/google-fonts@$V \
            react@18.3.1 react-dom@18.3.1
          npx remotion browser ensure

      - name: Make narration and sound effects (free voice)
        run: |
          pip install piper-tts
          python3 gen_audio.py

      - name: Render the MP4
        run: |
          mkdir -p out
          npx remotion render index.ts Main out/video.mp4 --codec=h264 --log=info

      - name: Check the result
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate:format=duration,size -of default=nw=1 out/video.mp4 | tee out/info.txt
          { echo "### Render finished"; echo '```'; cat out/info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the MP4 as a download (zip, 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: ai-phone-short-mp4
          path: out/video.mp4
          retention-days: 14

      - name: Publish a direct MP4 link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" out/video.mp4 \
            --title "Video ${{ github.run_number }}" \
            --notes "Rendered by GitHub Actions. Tap video.mp4 below to download."
